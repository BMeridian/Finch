specVersion: v0.1.0
package:
  name: finch_substreams
  version: v0.1.0
  url: https://github.com/asherbenj/finch
  description: >
    Finch — Pons V2 launches, Uniswap V4 PoolManager events filtered to the Pons
    Meme Hook, and ERC-20 Transfers on a configurable stock-token watch list on
    Robinhood Chain. Filter addresses are module params, not hardcoded.

network: robinhood

protobuf:
  files:
    - finch.proto
    - entity.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/finch_substreams.wasm

# Verified on Robinhood mainnet (RPC + ponsdotdev/ponsfamily source):
#   factory      0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e  (VERIFIED)
#   hook         0xE5e702641Ea86F4ae6cC3cDaeD2B886f976Be044  (VERIFIED)
#   fee_escrow   0xd3AFEB2a57f70eF218Aa82451c51B2fb0416Ac9e
#   distributor  0xe25e9bc31d24bb652fb6e2e466d7c9c89701173e  (demo-fixture instance)
#   tokens: NVDA,AAPL,TSLA,AMZN,WETH,USDG
params:
  map_raw: "factory=0x7ed598bcef8bd9edd8c97a195c6d13f40801ec7e&hook=0xe5e702641ea86f4ae6cc3cdaed2b886f976be044&fee_escrow=0xd3afeb2a57f70ef218aa82451c51b2fb0416ac9e&distributor=0xe25e9bc31d24bb652fb6e2e466d7c9c89701173e&tokens=0xd0601ce157db5bdc3162bbac2a2c8af5320d9eec,0xaf3d76f1834a1d425780943c99ea8a608f8a93f9,0x322f0929c4625ed5bad873c95208d54e1c003b2d,0x12f190a9f9d7d37a250758b26824b97ce941bf54,0x0bd7d308f8e1639fab988df18a8011f41eacad73,0x5fc5360d0400a0fd4f2af552add042d716f1d168"

modules:
  - name: map_raw
    kind: map
    initialBlock: 53480000
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:finch.v1.Events

  - name: store_meme_pools
    kind: store
    updatePolicy: set_if_not_exists
    valueType: int64
    initialBlock: 53480000
    inputs:
      - map: map_raw

  - name: map_events
    kind: map
    initialBlock: 53480000
    inputs:
      - map: map_raw
      - store: store_meme_pools
    output:
      type: proto:finch.v1.Events

  - name: graph_out
    kind: map
    initialBlock: 53480000
    inputs:
      - map: map_events
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges
