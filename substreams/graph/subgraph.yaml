specVersion: 1.0.0
description: Finch — Substreams-powered subgraph (Pinax source)
repository: https://github.com/asherbenj/finch
schema:
  file: ./schema.graphql
dataSources:
  - kind: substreams
    name: finch
    network: robinhood
    source:
      package:
        moduleName: graph_out
        file: ./finch-substreams-v0.1.0.spkg
    mapping:
      apiVersion: 0.0.9
      kind: substreams/graph-entities
