[package]
name    = "finch_substreams"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams          = "0.7"
substreams-ethereum = "0.11"
prost               = "0.13"
prost-types         = "0.13"
hex                 = "0.4"
hex-literal         = "0.4"
ethabi              = "17"

[build-dependencies]
substreams-ethereum = "0.11"
prost-build         = "0.13"

[profile.release]
lto       = true
opt-level = "s"
strip     = "debuginfo"
