specVersion: 0.0.5
description: Finch — indexes Pons launchpad activity and stock-token transfers on Robinhood Chain
schema:
  file: ./schema.graphql

# network: registry id is "robinhood" (eip155:4663); aliases "robinhood-mainnet",
# "robinhood-chain". Subgraph Studio does NOT support this chain. Confirm the exact
# slug in the Goldsky / Pinax dashboard before deploying.
#
# startBlock 56090000 — this is finch-LIVE: a short recent window kept fresh for
# "recent launches / just-happened" queries. Deep history + provenance is the
# separate finch-rpc/0.4.x deploy (subgraph/, startBlock 53480000).



dataSources:
  - kind: ethereum
    name: PonsV2Factory
    network: robinhood-mainnet
    source:
      address: "0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e"   # VERIFIED
      abi: PonsFactory
      startBlock: 56090000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/pons.ts
      entities: [Launchpad, TokenLaunch]
      abis:
        - name: PonsFactory
          file: ./abis/PonsFactory.json
      eventHandlers:
        - event: TokenLaunched(indexed address,indexed address,indexed address,address,uint256,uint256)
          handler: handleTokenLaunched
        - event: PoolGraduated(indexed address,uint256,uint256,uint256)
          handler: handlePoolGraduated
        - event: GraduationTokensPermanentlyLocked(indexed address,uint256)
          handler: handleGraduationTokensPermanentlyLocked

  - kind: ethereum
    name: PoolManager
    network: robinhood-mainnet
    source:
      address: "0x8366a39CC670B4001A1121B8F6A443A643e40951"   # code confirmed on-chain; role unverified
      abi: PoolManager
      startBlock: 56090000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/poolManager.ts
      entities: [Pool, SwapEvent, LiquidityEvent]
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap
        - event: ModifyLiquidity(indexed bytes32,indexed address,int24,int24,int256,bytes32)
          handler: handleModifyLiquidity

  # ---- Stock tokens: same ABI, same handler, different address ----
  - kind: ethereum
    name: NVDA
    network: robinhood-mainnet
    source: { address: "0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC", abi: ERC20, startBlock: 56090000 }
    mapping: &erc20mapping
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/transfers.ts
      entities: [Transfer, Wallet]
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer

  - kind: ethereum
    name: AAPL
    network: robinhood-mainnet
    source: { address: "0xaF3D76f1834A1d425780943C99Ea8A608f8a93f9", abi: ERC20, startBlock: 56090000 }
