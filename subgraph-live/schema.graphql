type Launchpad @entity {
  id: ID!
  name: String!
  launches: [TokenLaunch!]! @derivedFrom(field: "launchpad")
}

type TokenLaunch @entity {
  id: ID!
  launchpad: Launchpad!
  token: Bytes!
  curve: Bytes
  creator: Bytes!                 # the TokenLaunched `deployer`
  pairToken: Bytes
  graduationThreshold: BigInt
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  graduated: Boolean!
  graduationTx: Bytes
  graduationTimestamp: BigInt
}

type Pool @entity {
  id: ID!
  token: Bytes                # nullable — launched side, null when it can't be derived
  currency0: Bytes!
  currency1: Bytes!
  hook: Bytes!
  fee: Int!
  tickSpacing: Int!
  createdAtBlock: BigInt!
}

type LiquidityEvent @entity {
  id: ID!
  pool: Pool!
  provider: Bytes!
  liquidityDelta: BigInt!
  tickLower: Int!
  tickUpper: Int!
  timestamp: BigInt!
}

type SwapEvent @entity {
  id: ID!
  pool: Pool!
  sender: Bytes!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  liquidity: BigInt!
  timestamp: BigInt!
}

type Transfer @entity {
  id: ID!
  token: Bytes!
  from: Bytes!
  to: Bytes!
  amount: BigInt!
  fromLabel: String
  toLabel: String
  txHash: Bytes!
  block: BigInt!
  timestamp: BigInt!
}

type Wallet @entity {
  id: ID!
  firstSeenBlock: BigInt!
  firstSeenTimestamp: BigInt!
}
